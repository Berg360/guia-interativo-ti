
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>TechPath Academy | Formação em Tecnologia</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#17253a;
  --line:#293951;
  --text:#edf4ff;
  --muted:#a4b4cb;
  --accent:#66e0b0;
  --blue:#78a9ff;
  --danger:#ff8383;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px
}
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  gap:18px;padding:14px 5%;
  background:#0b1220ee;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)
}
.brand{font-size:20px;font-weight:850;letter-spacing:-.5px}
.brand span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;padding:10px 15px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);font-weight:650
}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#09271d;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.container{width:min(1180px,92%);margin:0 auto}
main{min-height:75vh;padding:32px 0 60px}
.hero{
  padding:50px 0 42px;display:grid;
  grid-template-columns:1.3fr .7fr;gap:35px;align-items:center
}
.eyebrow{
  display:inline-block;color:var(--accent);font-size:12px;
  letter-spacing:1.8px;font-weight:850;text-transform:uppercase
}
h1{font-size:clamp(34px,5vw,62px);line-height:1.08;letter-spacing:-2px;margin:15px 0}
h2{font-size:25px;letter-spacing:-.6px;margin:0 0 12px}
h3{font-size:18px;margin:8px 0}
p{color:var(--muted)}
.hero p{font-size:17px;max-width:640px}
.hero-art{
  border:1px solid var(--line);border-radius:24px;padding:25px;
  background:radial-gradient(circle at top right,#204e4c,transparent 55%),var(--panel);
  min-height:270px;display:flex;flex-direction:column;justify-content:center
}
.code-window{background:#09101c;border:1px solid var(--line);border-radius:12px;padding:20px}
.code-line{font-family:Consolas,monospace;color:var(--muted);margin:7px 0}
.green{color:var(--accent)}.blue{color:var(--blue)}
.section{margin-top:38px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;min-width:0
}
.card p{margin:8px 0 18px}
.card .bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.iconbox{
  width:46px;height:46px;display:grid;place-items:center;
  background:#1e3b3c;border:1px solid #2a5a51;border-radius:12px;
  font-size:23px;margin-bottom:15px
}
.tag{
  display:inline-block;font-size:11px;letter-spacing:.3px;
  border:1px solid var(--line);border-radius:30px;
  color:var(--muted);padding:4px 9px
}
.tag.free{color:var(--accent);border-color:#28604e}
.muted{color:var(--muted)}
.smalltext{font-size:13px}
.progress{height:7px;background:#26364c;border-radius:9px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}
.stat strong{font-size:25px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.form-card{max-width:560px;margin:20px auto}
label{display:block;font-weight:650;margin:12px 0 5px}
input,select,textarea{
  width:100%;padding:12px;background:#091321;
  color:var(--text);border:1px solid var(--line);
  border-radius:9px
}
textarea{min-height:100px;resize:vertical}
form .btn{margin-top:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.notice{padding:13px;border:1px solid var(--line);border-radius:10px;margin:14px 0}
.notice.success{border-color:#28604e;color:var(--accent)}
.notice.error{border-color:#704040;color:var(--danger)}
.lesson-layout{display:grid;grid-template-columns:270px 1fr;gap:20px}
.lesson-list button{
  display:block;width:100%;text-align:left;margin:6px 0;
  background:transparent;border:1px solid transparent;
  border-radius:9px;padding:10px;color:var(--muted)
}
.lesson-list button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}
.lesson-content{min-height:350px}
.lesson-content pre{
  white-space:pre-wrap;background:#07101c;border:1px solid var(--line);
  border-radius:10px;padding:15px;overflow:auto;color:var(--accent)
}
.quiz-option{
  display:block;width:100%;text-align:left;padding:12px;
  margin:8px 0;background:#0b1626;color:var(--text);
  border:1px solid var(--line);border-radius:9px
}
.quiz-option:hover{border-color:var(--accent)}
.quiz-option:disabled{cursor:default}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted)}
.hidden{display:none!important}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
@media(max-width:850px){
  .hero{grid-template-columns:1fr;padding-top:25px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lesson-layout{grid-template-columns:1fr}
  .lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
}
@media(max-width:560px){
  .topbar{padding:12px 4%;align-items:flex-start}
  .nav{justify-content:flex-end}
  .nav .btn{padding:7px 9px;font-size:12px}
  .brand{font-size:17px}
  .grid,.grid.two{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  h1{letter-spacing:-1px}
  .section-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>

const $ = (selector) => document.querySelector(selector);

function read(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch {
    return fallback;
  }
}

function write(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function id() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function currentUser() {
  const userId = read(DB.current, null);
  return read(DB.users, []).find(user => user.id === userId) || null;
}

function courses() {
  return read(DB.courses, []);
}

function progressData() {
  return read(DB.progress, {});
}

function progressKey(userId, courseId) {
  return userId + ":" + courseId;
}

function userProgress(user, course) {
  if (!user) return { lessons: [], score: 0, completed: false };
  return progressData()[progressKey(user.id, course.id)] ||
    { lessons: [], score: 0, completed: false };
}

function saveProgress(user, course, data) {
  const all = progressData();
  all[progressKey(user.id, course.id)] = data;
  write(DB.progress, all);
}

function notify(message, type="success") {
  const box = $("#notice");
  if (!box) {
    alert(message);
    return;
  }
  box.className = "notice " + type;
  box.textContent = message;
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function route() {
  const hash = location.hash.slice(1) || "home";
  const parts = hash.split("/");
  const user = currentUser();

  if (parts[0] === "logout") {
    write(DB.current, null);
    location.hash = "home";
    renderHome();
    return;
  }

  const routes = {
    home: renderHome,
    courses: renderCourses,
    login: renderLogin,
    register: renderRegister,
    dashboard: renderDashboard,
    lesson: () => renderLesson(parts[1], Number(parts[2] || 0)),
    projects: renderProjects,
    admin: renderAdmin,
    profile: renderProfile
  };

  if (["dashboard","lesson","projects","profile"].includes(parts[0]) && !user) {
    location.hash = "login";
    return;
  }

  if (parts[0] === "admin" && !user) {
    location.hash = "login";
    return;
  }

  (routes[parts[0]] || renderHome)();
  renderNav();
}

function renderNav() {
  const user = currentUser();
  let nav = `
    <a class="btn ghost" href="#courses">Cursos</a>
  `;

  if (user) {
    nav += `
      <a class="btn ghost" href="#dashboard">Minha área</a>
      <a class="btn ghost" href="#projects">Projetos</a>
    `;
    if (user.role === "admin") {
      nav += `<a class="btn ghost" href="#admin">Admin</a>`;
    }
    nav += `<a class="btn" href="#logout">Sair</a>`;
  } else {
    nav += `
      <a class="btn ghost" href="#login">Entrar</a>
      <a class="btn primary" href="#register">Criar conta grátis</a>
    `;
  }
  $("#navigation").innerHTML = nav;
}

async function passwordHash(password) {
  if (!window.crypto?.subtle) {
    throw new Error("Abra o site em localhost para usar o cadastro. A criptografia do navegador não está disponível neste contexto.");
  }
  const bytes = new TextEncoder().encode(password);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2,"0")).join("");
}

function renderDashboard() {
  const user = currentUser();
  if (!user) return;

  const all = courses().filter(c => c.published !== false);
  const records = all.map(c => ({course:c, data:userProgress(user,c)}));
  const completed = records.filter(r => r.data.completed).length;
  const started = records.filter(r => r.data.lessons.length > 0 && !r.data.completed).length;
  const totalLessons = records.reduce((sum,r) => sum+r.course.lessons.length,0);
  const doneLessons = records.reduce((sum,r) => sum+r.data.lessons.length,0);
  const percentage = totalLessons ? Math.round(doneLessons/totalLessons*100) : 0;

  app.innerHTML = `
    <span class="eyebrow">Área do membro</span>
    <h1 style="font-size:38px">Olá, ${escapeHTML(user.name)}.</h1>
    <p>Continue aprendendo e transformando conhecimento em prática.</p>
    <div class="stats">
      <div class="stat"><strong>${completed}</strong><span>Cursos concluídos</span></div>
      <div class="stat"><strong>${started}</strong><span>Cursos em andamento</span></div>
      <div class="stat"><strong>${percentage}%</strong><span>Progresso geral por aulas</span></div>
    </div>
    <section class="card">
      <span class="eyebrow">Seu perfil</span>
      <h2>${escapeHTML(user.goal || "Sua jornada de aprendizagem")}</h2>
      <p>Idade: ${user.age} · Perfil de aprendizagem adaptativo</p>
      <p>${escapeHTML(adaptiveMessage(user))}</p>
      <a href="#profile" class="btn">Editar preferências</a>
    </section>
    <section class="section">
      <div class="section-head"><h2>Continue seus estudos</h2><a href="#courses">Explorar cursos →</a></div>
      <div class="grid">${records.map(({course,data}) => {
        const count = data.lessons.length;
        const pct = course.lessons.length ? Math.round(count/course.lessons.length*100) : 0;
        return `
          <article class="card">
            <span class="tag">${escapeHTML(course.level)}</span>
            <h3>${escapeHTML(course.title)}</h3>
            <p>${escapeHTML(course.description)}</p>
            <div class="progress"><div style="width:${pct}%"></div></div>
            <p class="smalltext">${count}/${course.lessons.length} aulas registradas · ${pct}%</p>
            <a class="btn primary" href="#lesson/${encodeURIComponent(course.id)}/${Math.min(count,course.lessons.length-1)}">Continuar →</a>
          </article>`;
      }).join("")}</div>

  `;
}

function adaptiveMessage(user) {
  if (user.age < 16) return "Preferência inicial: exemplos concretos, linguagem direta e desafios graduais.";
  if (user.age < 18) return "Preferência inicial: desafios práticos, projetos guiados e desenvolvimento de autonomia.";
  return "Preferência inicial: projetos aplicados, documentação, boas práticas e competências profissionais.";
}

function renderLesson(courseId, lessonIndex) {
  const user = currentUser();
  const course = courses().find(c => c.id === courseId && c.published !== false);

  if (!course) {
    app.innerHTML = `<h1>Curso não encontrado</h1><a href="#courses">Voltar aos cursos</a>`;
    return;
  }

  lessonIndex = Math.max(0, Math.min(lessonIndex, course.lessons.length-1));
  const lesson = course.lessons[lessonIndex];
  const data = userProgress(user,course);
  const done = data.lessons.includes(lessonIndex);

  app.innerHTML = `
    <p><a href="#courses">← Catálogo</a></p>
    <span class="eyebrow">${escapeHTML(course.category)} · ${escapeHTML(course.level)}</span>
    <h1 style="font-size:38px">${escapeHTML(course.title)}</h1>
    <p>${escapeHTML(course.description)}</p>
    <div class="lesson-layout section">
      <aside class="card lesson-list">
        <h3>Módulos e aulas</h3>
        ${course.lessons.map((item,index)=>`
          <button class="${index===lessonIndex?"active":""}" data-lesson="${index}">
            ${data.lessons.includes(index)?"✓":"○"} ${index+1}. ${escapeHTML(item.title)}
          </button>`).join("")}
        <hr>
        <p class="smalltext">${data.lessons.length} de ${course.lessons.length} aulas concluídas</p>
      </aside>
      <section class="card lesson-content">
        <span class="tag">Aula ${lessonIndex+1} de ${course.lessons.length}</span>
        <h2>${escapeHTML(lesson.title)}</h2>
        <p>${escapeHTML(lesson.content)}</p>
        <h3>Exemplo prático</h3>
        <pre>${escapeHTML(lesson.code)}</pre>
        <hr>
        <h3>Desafio de aprendizagem</h3>
        <p>${escapeHTML(lesson.question)}</p>
        <div id="quizOptions">
          ${lesson.options.map((option,index)=>`
            <button class="quiz-option" data-answer="${index}">
              ${String.fromCharCode(65+index)}. ${escapeHTML(option)}
            </button>`).join("")}
        </div>
        <div id="quizFeedback" aria-live="polite"></div>
        <p class="smalltext">Responda ao desafio para registrar esta aula como concluída.</p>
      </section>
    </div>
  `;

  document.querySelectorAll("[data-lesson]").forEach(button=>{
    button.addEventListener("click",()=>{
      location.hash = `lesson/${encodeURIComponent(course.id)}/${button.dataset.lesson}`;
    });
  });

  document.querySelectorAll("[data-answer]").forEach(button=>{
    button.addEventListener("click",()=>{
      const answer = Number(button.dataset.answer);
      const feedback = $("#quizFeedback");
      const correct = answer === lesson.answer;

      document.querySelectorAll("[data-answer]").forEach(b=>b.disabled=true);

      if (correct) {
        feedback.innerHTML = `<div class="notice success"><strong>Resposta correta!</strong><br>${escapeHTML(lesson.explanation)}</div>`;
        if (user) {
          const updated = userProgress(user,course);
          if (!updated.lessons.includes(lessonIndex)) updated.lessons.push(lessonIndex);
          updated.score = Math.round(updated.lessons.length/course.lessons.length*100);
          updated.completed = updated.lessons.length === course.lessons.length;
          saveProgress(user,course,updated);
        } else {
          feedback.innerHTML += `<p><a href="#register">Crie uma conta para salvar seu progresso.</a></p>`;
        }
        feedback.innerHTML += lessonIndex < course.lessons.length-1
          ? `<button class="btn primary" id="nextLesson">Próxima aula →</button>`
          : `<a class="btn primary" href="${user?"#dashboard":"#register"}">Concluir percurso</a>`;
        $("#nextLesson")?.addEventListener("click",()=>{
          location.hash = `lesson/${encodeURIComponent(course.id)}/${lessonIndex+1}`;
        });
      } else {
        feedback.innerHTML = `<div class="notice error"><strong>Ainda não.</strong><br>Revise o conteúdo e tente novamente.</div>
          <button class="btn" id="tryAgain">Tentar novamente</button>`;
        $("#tryAgain").addEventListener("click",()=>renderLesson(course.id,lessonIndex));
      }
    });
  });
}
